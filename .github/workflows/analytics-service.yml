# =====================================================================================
# CI/CD - analytics-service (Python / Flask)
# =====================================================================================

name: CI/CD - analytics-service

on:
#  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'techchallange3/docker/analytics-service/**'
      - '.github/workflows/analytics-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'techchallange3/docker/analytics-service/**'
      - '.github/workflows/analytics-service.yml'

permissions:
  id-token: write
  contents: write 

concurrency:
  group: analytics-service-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: analytics-service
  SERVICE_PATH: techchallange3/docker/analytics-service
  PYTHON_VERSION: '3.11'
  AWS_REGION: us-east-1
  ECR_REPOSITORY: analytics-service
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:

  # ===================================================================================
  # JOB 1 - BUILD & UNIT TEST
  # ===================================================================================
  build-test:
    name: "1. Build & Unit Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/requirements.txt

      - name: Instalar dependências (equivalente ao "build" em Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verificar sintaxe (compileall) - falha rápido se o código não compilar
        run: python -m py_compile app.py

      - name: Rodar testes unitários (se houver)
        # "|| true" no find garante que o job não quebra quando ainda não existem testes;
        # quando vocês criarem uma pasta tests/ com arquivos test_*.py, o pytest passa a rodar de verdade.
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v --cov=. --cov-report=xml
          else
            echo "Nenhum teste encontrado ainda - pulando (adicione tests/test_*.py futuramente)."
          fi

  # ===================================================================================
  # JOB 2 - LINTER / STATIC ANALYSIS
  # ===================================================================================
  lint:
    name: "2. Linter / Static Analysis"
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar flake8
        run: pip install flake8

      - name: Rodar flake8
        run: flake8 . --max-line-length=120 --extend-exclude=.venv

  # ===================================================================================
  # JOB 3 - SECURITY SCAN (SAST + SCA)
  # ===================================================================================
  security-scan:
    name: "3. Security Scan (SAST & SCA)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # ---------- SCA: vulnerabilidades nas dependências (requirements.txt) ----------
      - name: "SCA - Trivy (filesystem / dependências)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ env.SERVICE_PATH }}
          scanners: 'vuln'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      # ---------- SAST: vulnerabilidades no código Python ----------
      - name: Instalar bandit
        run: pip install bandit

      - name: "SAST - bandit (código-fonte Python)"
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          # -lll = reporta e falha somente em severidade ALTA (equivalente ao "crítico" do desafio)
          bandit -r . -lll -f json -o bandit-results.json
        continue-on-error: false

      - name: Upload do relatório do bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ env.SERVICE_NAME }}
          path: ${{ env.SERVICE_PATH }}/bandit-results.json
          if-no-files-found: ignore

  # ===================================================================================
  # JOB 4 - DOCKER BUILD & PUSH
  # ===================================================================================
  docker-build-push:
    name: "4. Docker Build & Push"
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      id-token: write   # OIDC: troca o token do GitHub por credencial AWS
      contents: write   # o step de atualizar a tag commita de volta na main
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar tag da imagem (v1.0.0-<hash curto do commit>)
        id: vars
        run: echo "IMAGE_TAG=v1.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (sem push ainda)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          push: false
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Container Scan - Trivy (imagem Docker)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Configurar credenciais AWS (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      #- name: Configurar credenciais AWS (Academy - Access Keys temporárias)
      #  if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #  uses: aws-actions/configure-aws-credentials@v4
      #  with:
      #    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #    aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      #    aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag e push da imagem para o ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }}"
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Imagem publicada em: $IMAGE_URI"
    

      # ---------- GitOps: o Argo CD sincroniza a partir daqui ----------
      # Duas decisões que não são óbvias:
      #
      # 1. sed em vez de yq. O yq resolveria em uma linha, mas reescreve o
      #    arquivo inteiro no estilo de indentação dele - cada deploy viraria
      #    um diff de 40 linhas em vez de 1, poluindo o histórico que o Argo CD
      #    usa como fonte da verdade. O sed é ancorado no nome do repositório
      #    ECR e vem cercado de verificação antes e depois.
      #
      # 2. rebase-e-tenta-de-novo. Um commit que toca dois serviços dispara
      #    dois workflows, que terminam o build juntos e tentam commitar na
      #    main ao mesmo tempo. O segundo push morre com non-fast-forward e o
      #    manifesto fica com a tag velha - sem erro visível, o Argo CD
      #    sincroniza a imagem antiga. `concurrency` não serviria: a fila do
      #    GitHub guarda só UM job pendente por grupo e cancela os anteriores,
      #    então com 5 serviços simultâneos três atualizações sumiriam caladas.
      - name: Atualizar tag no Deployment YAML
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }}
          MANIFESTO: techchallange3/kubernetes/analytics-service/deployment.yaml
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            alvos=$(grep -c "image:.*/${ECR_REPOSITORY}:" "$MANIFESTO" || true)
            if [ "$alvos" -ne 1 ]; then
              echo "::error::Esperava 1 linha de imagem de ${ECR_REPOSITORY} em $MANIFESTO, encontrei $alvos."
              exit 1
            fi

            sed -i -E "s|(^[[:space:]]*-?[[:space:]]*image:[[:space:]]*).*/${ECR_REPOSITORY}:.*|\1${IMAGE_URI}|" "$MANIFESTO"

            if ! grep -q "image: ${IMAGE_URI}$" "$MANIFESTO"; then
              echo "::error::O sed não aplicou a nova tag em $MANIFESTO."
              exit 1
            fi

            if git diff --quiet -- "$MANIFESTO"; then
              echo "Manifesto já aponta para $IMAGE_URI - nada a commitar."
              exit 0
            fi

            git add "$MANIFESTO"
            git commit --quiet -m "chore(${{ env.SERVICE_NAME }}): imagem ${{ steps.vars.outputs.IMAGE_TAG }}"

            if git push --quiet origin HEAD:main; then
              echo "Manifesto atualizado para $IMAGE_URI"
              exit 0
            fi

            echo "Push rejeitado (tentativa $tentativa/5) - outro serviço commitou antes. Refazendo sobre a main nova."
            sleep $(( RANDOM % 5 + 2 ))
          done

          echo "::error::Não consegui atualizar $MANIFESTO após 5 tentativas."
          exit 1
