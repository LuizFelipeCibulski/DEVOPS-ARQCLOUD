# Onda -20: instala o External Secrets Operator. Precisa vir antes de
# tudo, porque as CRDs ExternalSecret/ClusterSecretStore que os outros
# manifestos usam nascem daqui.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      releaseName: external-secrets
      values: |
        # IRSA: sem esta anotação o operador tenta usar a credencial do
        # nó (que não tem acesso ao Secrets Manager) e todo ExternalSecret
        # fica em SecretSyncedError.
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::628409561285:role/togglemaster-external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # As CRDs do ESO são grandes demais para o apply client-side: sem
      # isto o sync falha com "metadata.annotations: Too long: must have
      # at most 262144 bytes".
      - ServerSideApply=true
