# Onda 40: consome da fila e grava no DynamoDB, tudo via IRSA. Não depende de secret nenhum.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: https://github.com/LuizFelipeCibulski/DEVOPS-ARQCLOUD
    targetRevision: main
    path: techchallange3/kubernetes/analytics-service
  destination:
    server: https://kubernetes.default.svc
    namespace: analytics-service
  ignoreDifferences:
    # O HPA (e no analytics também o KEDA) é o dono do número de réplicas.
    # O git diz `replicas: 1`; o KEDA escala para 0 quando a fila esvazia.
    # Sem esta exceção o Argo CD marca OutOfSync, o selfHeal devolve para 1,
    # o KEDA zera de novo - um cabo de guerra que nunca converge e ainda
    # anula o scale-to-zero.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true      # apagar um manifesto do git apaga o recurso no cluster
      selfHeal: true   # desfaz mudança feita à mão via kubectl
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      # A primeira implantação depende do ESO já ter materializado os
      # Secrets. Se ainda não materializou, o sync falha e volta.
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
