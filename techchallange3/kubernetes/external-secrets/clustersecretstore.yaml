# =====================================================================
# Ponte entre o AWS Secrets Manager e o Kubernetes
# ---------------------------------------------------------------------
# Um ClusterSecretStore (e não um SecretStore por namespace) porque os 5
# serviços leem do mesmo cofre; um único objeto evita repetir a mesma
# configuração cinco vezes.
#
# A autenticação é IRSA, não chave: o ESO usa a ServiceAccount
# external-secrets/external-secrets, que está anotada com o ARN da role
# togglemaster-external-secrets (criada em iac/main.tf). A policy dessa
# role só permite GetSecretValue nos secrets deste projeto.
# =====================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
