# =====================================================================
# evaluation-service - secrets vindos do AWS Secrets Manager
# ---------------------------------------------------------------------
# Este arquivo substitui o antigo secret.yaml. A diferença que importa:
# aqui não há valor nenhum, só o *caminho* do segredo no cofre. O ESO lê
# e materializa o Secret "evaluation-secrets" no cluster.
#
# Nunca commite um Secret com dados reais neste repositório - o Argo CD
# sincroniza com selfHeal, então ele venceria qualquer alteração manual.
# =====================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evaluation-secrets
  namespace: evaluation-service
spec:
  # Intervalo curto de propósito: a SERVICE_API_KEY abaixo só passa a
  # existir depois que o Job de bootstrap do auth-service rodar. Com 1h,
  # o evaluation ficaria até uma hora sem subir na primeira implantação.
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: evaluation-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: togglemaster/prod/evaluation-service
        property: REDIS_URL
    # Cofre diferente: este é escrito pelo Job de bootstrap, não pelo
    # Terraform (ver iac/modules/app-secrets/main.tf).
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: togglemaster/prod/service-api-key
        property: SERVICE_API_KEY
