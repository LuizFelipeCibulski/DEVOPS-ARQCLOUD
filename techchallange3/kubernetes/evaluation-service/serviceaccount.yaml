# A anotação é o que liga esta ServiceAccount à IAM role. O kubelet
# injeta um token JWT no pod, o SDK da AWS troca por credencial
# temporária, e não existe AWS_ACCESS_KEY_ID em lugar nenhum.
# A role e sua policy vivem em techchallange3/iac/main.tf (module.irsa_*).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service
  namespace: evaluation-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::628409561285:role/togglemaster-evaluation-service
