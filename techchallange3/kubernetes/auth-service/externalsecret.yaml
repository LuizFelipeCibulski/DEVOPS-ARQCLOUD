# =====================================================================
# auth-service - secrets vindos do AWS Secrets Manager
# ---------------------------------------------------------------------
# Este arquivo substitui o antigo secret.yaml. A diferença que importa:
# aqui não há valor nenhum, só o *caminho* do segredo no cofre. O ESO lê
# e materializa o Secret "auth-secrets" no cluster.
#
# Nunca commite um Secret com dados reais neste repositório - o Argo CD
# sincroniza com selfHeal, então ele venceria qualquer alteração manual.
# =====================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-secrets
  namespace: auth-service
spec:
  # De quanto em quanto tempo reconciliar com o cofre. Se alguém trocar
  # a senha do RDS no Secrets Manager, o Secret do cluster acompanha
  # sozinho dentro desse prazo.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/prod/auth-service
        property: DATABASE_URL
    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/prod/auth-service
        property: MASTER_KEY
