# ServiceAccount exclusiva do Job de bootstrap. Separada da aplicação de
# propósito: só ela pode escrever a SERVICE_API_KEY no Secrets Manager,
# e o auth-service em si não recebe permissão nenhuma na AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-bootstrap
  namespace: auth-service
  # Fase 4 (AWS Academy): SEM anotacao eks.amazonaws.com/role-arn. O Academy
  # nao permite criar IAM role, entao nao ha IRSA. Uma anotacao apontando
  # para role inexistente seria PIOR que nenhuma: o webhook do EKS injeta
  # AWS_ROLE_ARN no pod, o SDK tenta AssumeRoleWithWebIdentity, falha e NAO
  # cai para a credencial do no. Sem a anotacao, o SDK usa a cadeia padrao
  # e chega no IMDS do no (instance profile = LabRole).
