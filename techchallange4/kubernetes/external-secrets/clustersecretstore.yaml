# =====================================================================
# Ponte entre o AWS Secrets Manager e o Kubernetes
# ---------------------------------------------------------------------
# Um ClusterSecretStore (e não um SecretStore por namespace) porque os 5
# serviços leem do mesmo cofre; um único objeto evita repetir a mesma
# configuração cinco vezes.
#
# Fase 4 (AWS Academy): sem bloco "auth". Sem IRSA disponivel, o ESO usa
# a cadeia padrao de credenciais do SDK da AWS, que termina no IMDS do no
# (instance profile = LabRole). Em conta normal volte ao auth.jwt com a
# ServiceAccount anotada (ver techchallange3/).
# =====================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
