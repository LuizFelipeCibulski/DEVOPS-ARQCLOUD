# =====================================================================
# Loki - centralização dos logs de TODOS os containers do cluster
# ---------------------------------------------------------------------
# Quem coleta os logs NÃO é o Loki (nem Promtail): é o OTel Collector
# (DaemonSet, receiver filelog em /var/log/pods). O Collector enriquece
# cada linha com metadados do Kubernetes e envia via OTLP para o
# endpoint nativo do Loki 3.x:  http://loki:3100/otlp
#
# Modo SingleBinary: um único pod com todos os componentes (distributor,
# ingester, querier...). Adequado ao volume do desafio; em produção se
# usa SimpleScalable/Distributed com S3.
#
# Os atributos de resource do OTel viram labels indexados no Loki:
#   service.name        -> service_name
#   k8s.namespace.name  -> k8s_namespace_name
#   k8s.pod.name        -> k8s_pod_name   (etc.)
# =====================================================================
deploymentMode: SingleBinary

loki:
  auth_enabled: false       # single-tenant
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13          # v13 + tsdb: obrigatório para OTLP/structured metadata
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 72h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  # Sem EBS CSI no Academy -> sem PVC. Os dados ficam em emptyDir e se
  # perdem se o pod for recriado (ver "Limites" na documentação).
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# Os componentes dos outros modos ficam zerados.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomCompactor: {replicas: 0}
bloomGateway: {replicas: 0}

# Memcached de chunks/resultados: pede ~10 GiB de RAM por padrão.
chunksCache: {enabled: false}
resultsCache: {enabled: false}

gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
