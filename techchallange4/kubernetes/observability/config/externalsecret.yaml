# =====================================================================
# Tokens das integrações externas - vindos do AWS Secrets Manager
# ---------------------------------------------------------------------
# O cofre togglemaster/prod/observability é criado VAZIO pelo Terraform e
# preenchido por scripts/set-observability-secrets.sh (os tokens são de
# contas pessoais - New Relic, PagerDuty, Discord - e não devem passar
# pelo tfstate nem pelo git).
#
# dataFrom.extract: cada chave do JSON vira uma chave do Secret:
#   NEW_RELIC_LICENSE_KEY  -> OTel Collector (export para o New Relic)
#   PAGERDUTY_ROUTING_KEY  -> Grafana (contact point PagerDuty)
#   DISCORD_WEBHOOK_URL    -> Grafana (contact point Discord)
#   SELF_HEALER_TOKEN      -> Grafana (bearer do webhook do self-healer)
#   GRAFANA_ADMIN_USER/PASSWORD -> login do Grafana
# =====================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: observability-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/prod/observability
