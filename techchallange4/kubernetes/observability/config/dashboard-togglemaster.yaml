                "lineWidth": 2,
                "fillOpacity": 15,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "auth-service: % de 5xx agora",
          "id": 16,
