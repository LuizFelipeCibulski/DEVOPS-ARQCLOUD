          "id": 15,
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service_name, http_response_status_code) (rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[1m]))",
              "legendFormat": "{{service_name}} {{http_response_status_code}}",
              "datasource": {
