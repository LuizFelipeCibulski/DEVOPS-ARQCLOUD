          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 30
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(traces_span_metrics_calls_total{service_name=\"auth-service\",span_kind=\"SPAN_KIND_SERVER\",http_response_status_code=~\"5..\"}[2m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name=\"auth-service\",span_kind=\"SPAN_KIND_SERVER\"}[2m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
