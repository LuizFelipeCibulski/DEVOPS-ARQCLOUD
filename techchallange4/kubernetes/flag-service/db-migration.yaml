# =====================================================================
# Migração de schema do flag-service
# ---------------------------------------------------------------------
# Por que isto existe: o Terraform cria a instância RDS e o banco, mas
# não cria tabela nenhuma. O schema estava só em
# docker/flag-service/db/init.sql, documentado no README como um
# `psql -f` manual — que nunca foi executado contra o RDS. O sintoma foi
# o auth-service respondendo 500 em POST /admin/keys com
# 'relation "flags" does not exist', o que travava o Job de
# bootstrap e, em cascata, o evaluation-service.
#
# O SQL abaixo espelha docker/flag-service/db/init.sql, com duas
# adaptações obrigatórias para RDS:
#   - sem CREATE DATABASE: o banco já vem do Terraform, e o comando
#     falharia com "already exists"
#   - sem \c (meta-comando do psql): a DATABASE_URL já aponta para o
#     banco certo
#
# Mantenha os dois arquivos em sincronia ao mudar o schema.
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-service-schema
  namespace: flag-service
data:
  schema.sql: |
    
    -- Conecta no novo banco para criar as tabelas dele abaixo
    
    CREATE TABLE IF NOT EXISTS flags (
        id SERIAL PRIMARY KEY,
    
        -- 'name' é a chave de negócio única (ex: 'enable-new-checkout')
        name VARCHAR(100) UNIQUE NOT NULL, 
        
        description TEXT,
        
        -- Este é o 'kill switch' global. Se for false, a flag está desativada para todos.
        is_enabled BOOLEAN NOT NULL DEFAULT false,
        
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Opcional, mas boa prática: Trigger para atualizar 'updated_at' automaticamente
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    
    -- Remove o trigger se já existir, para evitar erro na recriação
    DROP TRIGGER IF EXISTS set_timestamp ON flags;
    
    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flag-service-migrate
  namespace: flag-service
  annotations:
    # Hook de Sync (não PreSync): precisa rodar DEPOIS que o
    # ExternalSecret materializou o Secret com a DATABASE_URL, e ANTES
    # do Deployment. Um PreSync rodaria antes do Secret existir e
    # travaria toda instalação nova.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: public.ecr.aws/docker/library/postgres:16-alpine
          command: ["/bin/sh", "-c"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-secrets
                  key: DATABASE_URL
          args:
            - |
              set -eu
              echo "Aplicando schema em flag-service..."
              # ON_ERROR_STOP faz o psql sair != 0 no primeiro erro; sem
              # isso o Job passaria verde com o schema pela metade.
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /schema/schema.sql
              echo "Schema aplicado."
          volumeMounts:
            - name: schema
              mountPath: /schema
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
      volumes:
        - name: schema
          configMap:
            name: flag-service-schema
